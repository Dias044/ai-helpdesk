<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI HelpDesk</title>
<style>
:root{--ac:#5b4bd6;--ac2:#eeebff;--bg:#f6f7fb;--tx:#1d2033;--mu:#6b7085;--bd:#e3e5ef}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit}.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}.btn.sec{background:#fff;color:var(--tx);border:1px solid var(--bd)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:#fff;margin:4px 0 10px}label{font-weight:600;font-size:13px}
.app{display:flex;min-height:100vh}.side{width:220px;background:#fff;border-right:1px solid var(--bd);padding:18px 12px}.logo{font-weight:700;font-size:18px;color:var(--ac);padding:0 8px 16px}
.nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--tx);cursor:pointer;margin-bottom:2px}.nav a.on{background:var(--ac2);color:var(--ac);font-weight:600}
.main{flex:1;padding:26px 32px;max-width:1100px}h1{margin:0 0 4px;font-size:22px}.sub{color:var(--mu);margin-bottom:18px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.p-Высокий{background:#fde2e2;color:#b42318}.p-Средний{background:#fff3c4;color:#8a6100}.p-Низкий{background:#e9eaf0;color:#555b70}
.s-Принято{background:#fff3c4;color:#8a6100}.s-В\ работе{background:#dbe8ff;color:#1b4fb8}.s-Решено{background:#d9f5e3;color:#0f7a3b}.cat{background:var(--ac2);color:var(--ac)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd)}th{background:#fafbff;font-size:12px;color:var(--mu);text-transform:uppercase}tr.cl{cursor:pointer}tr.cl:hover{background:#fafaff}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs a{padding:6px 14px;border-radius:99px;border:1px solid var(--bd);background:#fff;cursor:pointer}.tabs a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{height:10px;background:#e8e9f3;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.ans{background:var(--ac2);border-left:4px solid var(--ac);padding:12px 14px;border-radius:8px}.kpi{flex:1;min-width:170px}.kpi b{font-size:26px;display:block}
.chat{max-height:280px;overflow:auto;margin-bottom:10px}.msg{max-width:70%;padding:8px 12px;border-radius:12px;margin:6px 0;background:#eef0f7}.msg.me{margin-left:auto;background:var(--ac);color:#fff}.msg small{display:block;opacity:.7;font-size:11px}
.err{color:#b42318;margin:6px 0}.login{max-width:900px;margin:60px auto;display:flex;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px #2a2a5a22}.login .l{flex:1;background:linear-gradient(135deg,#5b4bd6,#3b6fe0);color:#fff;padding:36px}.login .r{flex:1;background:#fff;padding:36px}
.step{display:flex;gap:16px}.step div{flex:1;text-align:center;padding:8px;border-radius:8px;background:#eef0f7;color:var(--mu)}.step .on{background:var(--ac);color:#fff}
.svgc text{font-size:11px;fill:#6b7085}
.toast{position:fixed;right:20px;bottom:20px;background:#1d2033;color:#fff;padding:12px 16px;border-radius:10px;max-width:360px;z-index:9;box-shadow:0 6px 24px #0003}.toast.e{background:#b42318}
.note{background:#fff8e1;border-left:4px solid #f5b700;padding:10px 14px;border-radius:8px;margin:8px 0}.ok{background:#e8f7ee;border-left-color:#0f7a3b}
.sus td{padding:8px 6px}.sus input{width:auto;margin:0}.cnt{font-size:12px;color:var(--mu);text-align:right;margin-top:-6px}
.sug{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin:8px 0}.sug small{color:var(--mu)}
.thumb{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}.thumb.on{background:var(--ac2);border-color:var(--ac)}
@media(max-width:760px){.app{flex-direction:column}.side{width:auto;border-right:0;border-bottom:1px solid var(--bd);padding:10px}
 .logo{padding:0 4px 8px}.nav{display:flex;gap:4px;overflow-x:auto}.nav a{white-space:nowrap;margin:0}.side>div:last-child{margin-top:8px!important}
 .main{padding:16px 12px}.login{flex-direction:column;margin:16px}.tabs{overflow-x:auto}.kpi{min-width:140px}
 table{display:block;overflow-x:auto;white-space:nowrap}.msg{max-width:90%}.row>select,.row>input{width:100%!important}}
</style></head><body><div id="root"></div>
<script>
let S={token:localStorage.getItem('hd_token'),role:localStorage.getItem('hd_role'),name:localStorage.getItem('hd_name'),page:null,mode:'login',tab:'Все',cats:[]};
const $=s=>document.querySelector(s),R=$('#root'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(m,p,b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:b?JSON.stringify(b):undefined});
 const d=await r.json().catch(()=>({}));if(r.status===401&&S.token&&!p.startsWith('/auth')){logout();throw new Error('Сессия истекла')}if(!r.ok)throw new Error(d.error||'Ошибка');return d}
function toast(t,e){const d=document.createElement('div');d.className='toast'+(e?' e':'');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}
async function safe(f){try{await f()}catch(e){toast(e.message,1)}}
function logout(){localStorage.clear();S.token=null;S.role=null;render()}
const pr=p=>p?`<span class="tag p-${p}">${p}</span>`:'',st=s=>`<span class="tag s-${s}">${s}</span>`,ct=c=>c?`<span class="tag cat">${esc(c)}</span>`:'';
const fmt=d=>d?d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4)+' '+d.slice(11,16):'—';
function shell(menu,html){return `<div class="app"><div class="side"><div class="logo">AI HelpDesk</div><div class="nav">${menu.map(m=>`<a class="${S.page===m[0]?'on':''}" onclick="go('${m[0]}')">${m[1]}</a>`).join('')}</div>
<div style="margin-top:30px;padding:0 8px;color:var(--mu);font-size:12px">${esc(S.name)}<br>${{student:'Студент',operator:'Оператор',admin:'Администратор'}[S.role]}<br><a style="color:var(--ac);cursor:pointer" onclick="logout()">Выйти</a></div></div><div class="main" id="main">${html}</div></div>`}
const MENU={student:[['my','Мои обращения'],['new','Создать обращение'],['survey','Оценить систему']],operator:[['queue','Входящие обращения'],['survey','Оценить систему']],admin:[['dash','Обзор'],['fb','Обратная связь'],['cats','Категории'],['users','Пользователи']]};
function go(p,arg){S.page=p;S.arg=arg;render()}
async function render(){
 if(!S.token){const reg=S.mode==='reg';R.innerHTML=`<div class="login"><div class="l"><h1>AI HelpDesk</h1><p>Интеллектуальная система обработки обращений студентов университета «Туран».</p><p>• ИИ определяет категорию и приоритет<br>• Ответ из базы знаний со ссылкой на источник<br>• Сложные вопросы — оператору</p></div>
 <div class="r"><div class="tabs"><a class="${!reg?'on':''}" onclick="S.mode='login';render()">Вход</a><a class="${reg?'on':''}" onclick="S.mode='reg';render()">Регистрация</a></div>
 ${reg?'<label>Имя и фамилия</label><input id="nm">':''}<label>E-mail</label><input id="em" value="${reg?'':'student@turan.edu.kz'}"><label>Пароль</label><input id="pw" type="password" value="${reg?'':'student123'}">
 <div class="err" id="er"></div><button class="btn" style="width:100%" onclick="auth()">${reg?'Зарегистрироваться':'Войти'}</button>
 ${reg?'':'<p style="color:var(--mu);font-size:12px">Демо: student@ / operator@ / admin@turan.edu.kz — пароли student123 / operator123 / admin123</p>'}</div></div>`;return}
 if(!S.page)S.page=MENU[S.role][0][0];
 try{const f={my:vMy,new:vNew,queue:vQueue,dash:vDash,cats:vCats,users:vUsers,ticket:vTicket,result:vTicket,survey:vSurvey,fb:vFb}[S.page];R.innerHTML=shell(MENU[S.role],'<div id="c"></div>');await f($('#c'))}catch(e){R.innerHTML=shell(MENU[S.role],`<div class="err">${esc(e.message)}</div>`)}}
async function auth(){try{const reg=S.mode==='reg',b={email:$('#em').value,password:$('#pw').value};if(reg)b.name=$('#nm').value;const d=await api('POST',reg?'/auth/register':'/auth/login',b);
 S.token=d.token;S.role=d.role;S.name=d.name;localStorage.setItem('hd_token',d.token);localStorage.setItem('hd_role',d.role);localStorage.setItem('hd_name',d.name);S.page=null;render()}catch(e){$('#er').textContent=e.message}}
async function vMy(c){const t=await api('GET','/tickets'),f=S.tab==='Все'?t:t.filter(x=>x.status===S.tab);
 c.innerHTML=`<div class="row"><div class="sp"><h1>Мои обращения</h1><div class="sub">Список ваших обращений и их статусы</div></div><button class="btn" onclick="go('new')">+ Создать обращение</button></div>
 <div class="tabs">${['Все','Принято','В работе','Решено'].map(x=>`<a class="${S.tab===x?'on':''}" onclick="S.tab='${x}';render()">${x}</a>`).join('')}</div>
 ${f.map(x=>`<div class="card cl" style="cursor:pointer" onclick="go('ticket',${x.id})"><div class="row"><b>${esc(x.subject)}</b><span class="sp"></span>${ct(x.category)}${pr(x.priority)}${st(x.status)}</div><div class="sub" style="margin:4px 0 0">${x.code} · ${fmt(x.created_at)}</div></div>`).join('')||'<div class="card">Обращений нет</div>'}`}
async function vNew(c){c.innerHTML=`<h1>Новое обращение</h1><div class="sub">Чем подробнее описание, тем быстрее ИИ подберёт решение</div><div class="card"><label>Тема</label><input id="sj" maxlength="200"><label>Текст обращения</label><textarea id="tx" rows="6" maxlength="5000" oninput="$('#cn').textContent=this.value.length+' / 5000'"></textarea><div class="cnt" id="cn">0 / 5000</div>
 <label>Вложение (необязательно)</label><input type="file" id="fl"><div class="err" id="er"></div><div class="row"><button class="btn sec" onclick="go('my')">Отмена</button><button class="btn" id="sb" onclick="send()">Отправить</button></div></div>`}
async function send(){try{const b={subject:$('#sj').value,text:$('#tx').value},f=$('#fl').files[0];if(f){if(f.size>3e6)throw new Error('Файл больше 3 МБ');
 b.attachment={name:f.name,data:await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)})}}
 $('#sb').disabled=true;$('#sb').textContent='ИИ анализирует обращение…';const d=await api('POST','/tickets',b);go('result',d.id)}catch(e){$('#er').textContent=e.message;$('#sb').disabled=false;$('#sb').textContent='Отправить'}}
async function vTicket(c){const id=S.arg,t=await api('GET','/tickets/'+id),m=await api('GET',`/tickets/${id}/messages`),a=t.ai,op=S.role==='operator',stu=S.role==='student';
 const fresh=S.page==='result'&&stu&&!t.in_queue&&t.status!=='Решено';const idx=['Принято','В работе','Решено'].indexOf(t.status);
 c.innerHTML=`<div class="row"><div class="sp"><h1>${esc(t.subject)}</h1><div class="sub">${t.code} · ${esc(t.student)} · ${fmt(t.created_at)}</div></div><button class="btn sec" onclick="go('${stu?'my':'queue'}')">← К списку</button></div>
 <div class="card"><div class="row">${ct(t.category)}${pr(t.priority)}${st(t.status)}${t.confidence?`<span class="sp"></span><span style="color:var(--mu)">Уверенность ИИ: ${Math.round(t.confidence*100)}%</span>`:''}</div>
 ${t.confidence?`<div class="bar" style="margin:10px 0"><i style="width:${Math.round(t.confidence*100)}%"></i></div>`:''}<p>${esc(t.body)}</p>${t.attachments.length?`<div class="sub">📎 ${t.attachments.map(esc).join(', ')}</div>`:''}</div>
 ${a&&a.auto?`<div class="card"><b>Ответ из базы знаний</b><div class="ans" style="margin:8px 0">${esc(a.answer)}</div><div class="sub">Источник: ${esc(a.article.source)}, «${esc(a.article.title)}», обновлено ${esc(a.article.updated_at)}</div>
 ${stu?`<div class="row" style="margin:6px 0 10px"><span class="sub" style="margin:0">Ответ был полезен?</span><button class="thumb ${t.feedback===true?'on':''}" onclick="rate(true)">👍 Да</button><button class="thumb ${t.feedback===false?'on':''}" onclick="rate(false)">👎 Нет</button></div>`:''}
 ${fresh?`<div class="row"><button class="btn" onclick="act('confirm')">Это решило мой вопрос</button><button class="btn sec" onclick="act('escalate')">Отправить оператору</button></div>`:''}
 ${stu&&t.in_queue&&t.status!=='Решено'?'<div class="note">Обращение передано оператору. Ответ появится в чате ниже, статус изменится на «В работе».</div>':''}
 ${stu&&t.auto_resolved?'<div class="note ok">Вы подтвердили, что ответ решил вопрос. Обращение закрыто.</div>':''}</div>`
 :(a&&stu?`<div class="card"><div class="note">ИИ не дал автоматический ответ${a.reason?' ('+esc(a.reason)+')':''} — обращение передано оператору. Ответ появится в чате ниже.</div></div>`:'')}
 ${op&&t.status!=='Решено'?`<div class="card"><b>Подсказки из базы знаний</b><div class="sub" style="margin:2px 0 0">Ближайшие документы — можно вставить текст в чат и отредактировать${a&&a.reason?' · причина отказа от автоответа: '+esc(a.reason):''}</div>${(await api('GET',`/tickets/${id}/suggest`)).map(x=>`<div class="sug"><div class="row"><b>${esc(x.title)}</b><span class="sp"></span><small>${esc(x.category)} · близость ${Math.round(x.similarity*100)}%</small></div><div style="margin:4px 0">${esc(x.text)}</div><a style="color:var(--ac);cursor:pointer" onclick="$('#mt').value=this.parentNode.children[1].textContent;$('#mt').focus()">Вставить в чат</a></div>`).join('')}</div>`:''}
 <div class="card"><b>Статус обращения</b><div class="step" style="margin:10px 0">${['Принято','В работе','Решено'].map((x,i)=>`<div class="${i<=idx?'on':''}">${x}</div>`).join('')}</div>
 <div class="sub">Ответственный: ${esc(t.operator||'не назначен')}${t.taken_at?' · взято в работу '+fmt(t.taken_at):''}${t.resolved_at?' · решено '+fmt(t.resolved_at):''}</div>
 ${op&&t.status!=='Решено'?`<div class="row"><select id="ns" style="width:160px;margin:0"><option>В работе</option><option>Решено</option></select><select id="nc" style="width:220px;margin:0"><option value="">Категория без изменений</option>${(await api('GET','/admin/categories')).filter(x=>x.active).map(x=>`<option>${esc(x.name)}</option>`).join('')}</select><button class="btn" onclick="setSt(${t.id})">Сохранить</button></div>`:''}</div>
 <div class="card"><b>Чат по обращению</b><div class="chat">${m.map(x=>`<div class="msg ${x.mine?'me':''}"><small>${esc(x.sender)} · ${fmt(x.at)}</small>${esc(x.text)}</div>`).join('')||'<div class="sub">Сообщений пока нет</div>'}</div>
 ${t.status==='Решено'&&stu?'':`<div class="row"><input id="mt" style="margin:0;flex:1" maxlength="5000" placeholder="Введите сообщение" onkeydown="if(event.key==='Enter')msg(${t.id})"><button class="btn" onclick="msg(${t.id})">Отправить</button></div>`}</div>`}
async function act(a){await safe(async()=>{await api('POST',`/tickets/${S.arg}/${a}`,{});toast(a==='confirm'?'Обращение закрыто':'Обращение передано оператору');go('ticket',S.arg)})}
async function rate(h){await safe(async()=>{const c=h?'':(prompt('Что было не так с ответом? (необязательно)')||'');await api('POST',`/tickets/${S.arg}/feedback`,{helpful:h,comment:c});toast('Спасибо за оценку!');go(S.page,S.arg)})}
async function msg(id){const v=$('#mt').value;if(!v.trim())return;await safe(async()=>{await api('POST',`/tickets/${id}/messages`,{text:v});go('ticket',id)})}
async function setSt(id){await safe(async()=>{await api('PATCH',`/tickets/${id}/status`,{status:$('#ns').value,category:$('#nc').value||undefined});toast('Изменения сохранены');go('ticket',id)})}
const SUSQ=['Я думаю, что хотел(а) бы часто пользоваться этой системой','Система показалась мне излишне сложной','Системой было легко пользоваться','Мне понадобится помощь специалиста, чтобы пользоваться системой','Функции системы хорошо связаны между собой','В системе слишком много несогласованности','Большинство людей быстро научатся пользоваться системой','Системой было очень неудобно пользоваться','Я чувствовал(а) себя уверенно при работе с системой','Мне пришлось многому научиться, прежде чем начать работу'];
async function vSurvey(c){c.innerHTML=`<h1>Оценить систему</h1><div class="sub">Анкета SUS (System Usability Scale): 1 — полностью не согласен, 5 — полностью согласен. Заполнение занимает 2 минуты.</div><div class="card"><table class="sus" style="border:0">${SUSQ.map((q,i)=>`<tr><td>${i+1}. ${q}</td>${[1,2,3,4,5].map(v=>`<td><label><input type="radio" name="q${i}" value="${v}"> ${v}</label></td>`).join('')}</tr>`).join('')}</table>
 <label>Что улучшить? Какие ошибки заметили?</label><textarea id="sc" rows="3" maxlength="2000"></textarea><div class="err" id="er"></div><button class="btn" onclick="sendSurvey()">Отправить анкету</button></div>`}
async function sendSurvey(){const a=SUSQ.map((_,i)=>{const x=document.querySelector(`input[name=q${i}]:checked`);return x?+x.value:null});if(a.includes(null)){$('#er').textContent='Ответьте на все 10 вопросов';return}
 await safe(async()=>{const d=await api('POST','/survey',{answers:a,comment:$('#sc').value});$('#c').innerHTML=`<div class="card"><h1>Спасибо!</h1><p>Ваша оценка удобства: <b>${d.sus}</b> из 100.</p></div>`})}
async function vFb(c){const d=await api('GET','/admin/feedback');c.innerHTML=`<h1>Обратная связь</h1><div class="sub">Оценки автоответов студентами и результаты анкеты SUS</div>
 <div class="row"><div class="card kpi">Оценок автоответов<b>${d.feedback_n}</b></div><div class="card kpi">Полезных ответов<b>${d.helpful_rate??'—'}%</b></div><div class="card kpi">Анкет SUS<b>${d.survey_n}</b></div><div class="card kpi">Средний балл SUS<b>${d.sus_mean??'—'}</b></div></div>
 <div class="card"><b>Полезность автоответов по категориям</b>${Object.keys(d.by_category).length?bars(Object.fromEntries(Object.entries(d.by_category).map(([k,v])=>[k+' ('+v.n+' оц.)',v.helpful]))):'<div class="sub">Оценок пока нет</div>'}</div>
 <b>Комментарии пользователей</b><table style="margin-top:8px"><tr><th>Тип</th><th>Пользователь</th><th>Оценка</th><th>Комментарий</th><th>Дата</th></tr>${d.comments.map(x=>`<tr><td>${x.kind}</td><td>${esc(x.user)}</td><td>${esc(x.value)}</td><td>${esc(x.text)}</td><td>${fmt(x.at)}</td></tr>`).join('')||'<tr><td colspan="5">Комментариев пока нет</td></tr>'}</table>`}
async function vQueue(c){if(!S.cats.length)S.cats=await api('GET','/admin/categories');const f=S.f||{};const q=new URLSearchParams(Object.entries(f).filter(e=>e[1])).toString(),t=await api('GET','/tickets?'+q);
 const sel=(k,o,l)=>`<select style="width:190px;margin:0" onchange="S.f={...S.f,${k}:this.value};render()"><option value="">${l}</option>${o.map(x=>`<option ${f[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
 c.innerHTML=`<h1>Входящие обращения</h1><div class="sub">Категория, приоритет и уверенность определены ИИ и служат подсказкой</div><div class="row" style="margin-bottom:12px"><input id="sq" value="${esc(f.q||'')}" placeholder="Поиск по теме или номеру" style="width:260px;margin:0" onkeydown="if(event.key==='Enter'){S.f={...S.f,q:this.value};render()}">
 ${sel('category',S.cats.map(x=>x.name),'Все категории')}${sel('priority',['Высокий','Средний','Низкий'],'Все приоритеты')}${sel('status',['Принято','В работе','Решено'],'Все статусы')}</div>
 <table><tr><th>ID</th><th>Тема</th><th>Категория (ИИ)</th><th>Приоритет (ИИ)</th><th>Уверенность</th><th>Статус</th><th>Дата</th></tr>${t.map(x=>`<tr class="cl" onclick="go('ticket',${x.id})"><td>${x.code}</td><td>${esc(x.subject)}</td><td>${ct(x.category)}</td><td>${pr(x.priority)}</td><td>${x.confidence?Math.round(x.confidence*100)+'%':'—'}</td><td>${st(x.status)}</td><td>${fmt(x.created_at)}</td></tr>`).join('')}</table><div class="sub" style="margin-top:8px">Найдено: ${t.length}${t.length>=200?' (показаны последние 200 — уточните поиск или фильтры)':''}</div>`}
function bars(o,col){const m=Math.max(1,...Object.values(o));return Object.entries(o).map(([k,v])=>`<div style="margin:7px 0"><div class="row"><span class="sp">${esc(k)}</span><b>${v}</b></div><div class="bar"><i style="width:${v/m*100}%;${col?'background:'+col[k]:''}"></i></div></div>`).join('')}
async function vDash(c){const d=await api('GET','/admin/stats?days='+(S.days||30)),k=Object.entries(d.daily),mx=Math.max(1,...k.map(x=>x[1])),W=520,H=150;
 const pts=k.map((x,i)=>`${30+i*(W-40)/Math.max(1,k.length-1)},${H-20-x[1]/mx*(H-40)}`).join(' ');
 c.innerHTML=`<div class="row"><div class="sp"><h1>Обзор</h1><div class="sub">Показатели службы поддержки</div></div><select style="width:150px" onchange="S.days=this.value;render()">${[7,30,90].map(x=>`<option value="${x}" ${(S.days||30)==x?'selected':''}>${x} дней</option>`).join('')}</select></div>
 <div class="row"><div class="card kpi">Всего обращений<b>${d.total}</b></div><div class="card kpi">Решено автоматически<b>${d.auto_rate}%</b></div><div class="card kpi">Среднее время ответа<b>${d.avg_response_min??'—'} мин</b></div><div class="card kpi">Точность ИИ<b>${d.ai_accuracy??'—'}%</b></div><div class="card kpi">Полезность ответов<b>${d.helpful_rate??'—'}%</b></div><div class="card kpi">Удобство (SUS)<b>${d.sus_mean??'—'}</b></div></div>
 <div class="row" style="align-items:stretch"><div class="card" style="flex:2"><b>Динамика обращений</b><svg class="svgc" viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="#5b4bd6" stroke-width="2.5" points="${pts}"/><text x="2" y="18">${mx}</text><text x="2" y="${H-18}">0</text><text x="30" y="${H-4}">${k[0]?k[0][0].slice(5):''}</text><text x="${W-50}" y="${H-4}">${k.length?k[k.length-1][0].slice(5):''}</text></svg></div>
 <div class="card" style="flex:1"><b>По приоритетам</b>${bars(d.by_priority,{Высокий:'#e5484d',Средний:'#f5b700',Низкий:'#9aa0b5'})}</div></div>
 <div class="card"><b>По категориям</b>${bars(d.by_category)}</div><b>Последние обращения</b><table style="margin-top:8px"><tr><th>ID</th><th>Тема</th><th>Категория</th><th>Статус</th></tr>${d.recent.map(x=>`<tr><td>${x.code}</td><td>${esc(x.subject)}</td><td>${ct(x.category)}</td><td>${st(x.status)}</td></tr>`).join('')}</table>`}
async function vCats(c){const t=await api('GET','/admin/categories');c.innerHTML=`<h1>Категории обращений</h1><div class="sub">Настройка маршрутизации</div><div class="row"><input id="cn" placeholder="Название новой категории" style="width:300px;margin:0"><button class="btn" onclick="addCat()">Добавить</button><span class="err" id="er"></span></div><br>
 <table><tr><th>Категория</th><th>Обращений</th><th>Статус</th><th></th></tr>${t.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.count}</td><td>${x.active?'Активна':'Отключена'}</td><td><a style="color:var(--ac);cursor:pointer" onclick="togCat(${x.id},${x.active?0:1})">${x.active?'Отключить':'Включить'}</a></td></tr>`).join('')}</table>`}
async function addCat(){try{await api('POST','/admin/categories',{name:$('#cn').value});render()}catch(e){$('#er').textContent=e.message}}
async function togCat(id,a){await safe(async()=>{await api('PATCH','/admin/categories/'+id,{active:a});toast(a?'Категория включена':'Категория отключена: автоответы по ней не выдаются');render()})}
async function vUsers(c){const t=await api('GET','/admin/users');c.innerHTML=`<h1>Пользователи</h1><div class="sub">Роли и блокировка учётных записей</div><table><tr><th>Имя</th><th>E-mail</th><th>Роль</th><th>Статус</th><th></th></tr>${t.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td>
 <td><select style="margin:0;width:140px" onchange="pu(${x.id},{role:this.value})">${['student','operator','admin'].map(r=>`<option value="${r}" ${x.role===r?'selected':''}>${{student:'Студент',operator:'Оператор',admin:'Администратор'}[r]}</option>`).join('')}</select></td><td>${x.status==='active'?'Активен':'Заблокирован'}</td>
 <td><a style="color:var(--ac);cursor:pointer" onclick="pu(${x.id},{status:'${x.status==='active'?'blocked':'active'}'})">${x.status==='active'?'Заблокировать':'Разблокировать'}</a></td></tr>`).join('')}</table><div class="err" id="er"></div>`}
async function pu(id,b){try{await api('PATCH','/admin/users/'+id,b);toast('Сохранено');render()}catch(e){toast(e.message,1);render()}}
render();
</script></body></html>
